[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan"
version = "0.0.1"
description = "Scanner réseau en ligne de commande inspiré de nmap (découverte d'hôtes, scan de ports, API REST)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Timothée Dray" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["netscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "root: tests nécessitant les droits root (exclus de la CI)",
]